<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil Github</title>

<link rel="stylesheet" href="main.css">

</head>
<body>

<div class="container">

    <header>
        <img id="avatar" src="" alt="Avatar Github">
        <h1 id="nome"></h1>
        <h2 id="username"></h2>
    </header>

    <ul class="numeros">
        <li>
            <h4>Repositórios</h4>
            <span id="repositorios"></span>
        </li>

        <li>
            <h4>Seguidores</h4>
            <span id="seguidores"></span>
        </li>

        <li>
            <h4>Seguindo</h4>
            <span id="seguindo"></span>
        </li>
    </ul>

    <a id="linkGithub" target="_blank">
        Ver no Github
    </a>

</div>

<script src="main.js"></script>

</body>
</html>
